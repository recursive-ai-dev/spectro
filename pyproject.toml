[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spectro"
version = "2.0.0"
description = "Spectro audio synthesis workbench and Spectral-State Guided Synthesis library"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Damien Davison"},
    {name = "Michael Maillet"},
    {name = "Sacha Davison"}
]
keywords = ["audio", "dsp", "lpc", "hmm", "synthesis", "generative"]
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "soundfile>=0.10.0",
    "PyWavelets>=1.1.0",
    "safetensors>=0.4.0",
]

[project.scripts]
spectro = "ssgs.cli:main"
spectro-gui = "ssgs.desktop:main"

[project.urls]
Repository = "https://github.com/recursive-ai-dev/spectro"
Issues = "https://github.com/recursive-ai-dev/spectro/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["ssgs"]

[tool.setuptools.package-data]
ssgs = ["ssgs_native.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "examples"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
