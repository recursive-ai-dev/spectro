name: Test and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  test:
    name: Python ${{ matrix.python }} and native kernels
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install native and desktop test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3-tk libsndfile1 xvfb xauth
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]' build
      - name: Build native kernels
        run: make
      - name: Run all tests with a virtual display
        run: xvfb-run -a .venv/bin/python -m pytest -q
      - name: Build wheel and source distribution
        run: .venv/bin/python -m build --outdir dist/python
      - name: Verify the installed wheel away from the source tree
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/python/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.wheel-venv/bin/spectro" --version
          "$GITHUB_WORKSPACE/.wheel-venv/bin/spectro" doctor --json

  debian:
    name: Debian artifact and extracted runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential dpkg-dev desktop-file-utils python3-tk libsndfile1
      - name: Prepare the runtime verification environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install .
      - name: Build and inspect the Debian package
        run: |
          .venv/bin/python scripts/build_deb.py
          .venv/bin/python scripts/check_deb.py dist/spectro_*.deb --python .venv/bin/python
      - name: Verify reproducibility
        run: |
          .venv/bin/python scripts/build_deb.py --output-dir dist/repro
          cmp dist/spectro_*.deb dist/repro/spectro_*.deb
      - name: Upload Debian package, checksum, and build manifest
        uses: actions/upload-artifact@v7
        with:
          name: spectro-debian-amd64
          path: |
            dist/*.deb
            dist/*.deb.sha256
            dist/*.deb.json
          if-no-files-found: error
          compression-level: 0
